<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >

  <title>ガールズ競輪予想</title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
      background: #ffffff;
      color: #111111;
    }


    body {
      min-height: 100vh;
      overflow-x: hidden;
    }


    button {
      font-family: inherit;
    }


    /* ========================================
       全体
    ======================================== */

    .app {
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
      overflow: hidden;
    }


    /* ========================================
       ヘッダー
    ======================================== */

    .header {
      width: 100%;
      padding: 28px 20px 22px;
      background: #ffffff;
      border-bottom: 5px solid #d82c78;
      text-align: center;
    }


    .main-title {
      margin: 0;
      color: #d82c78;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -1px;
      white-space: nowrap;
    }


    .sub-title {
      margin-top: 8px;
      color: #111111;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
    }


    /* ========================================
       メニュー
    ======================================== */

    .menu {
      width: 100%;
      padding: 28px 18px 0;
    }


    .menu-item {
      width: 100%;
      min-height: 106px;
      margin: 0 0 18px;
      padding: 0;
      display: flex;
      align-items: stretch;
      border: 2px solid #eeeeee;
      border-radius: 24px;
      background: #ffffff;
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      appearance: none;
      cursor: pointer;
      text-align: left;
    }


    .menu-item:active {
      transform: scale(0.99);
    }


    /* ========================================
       アイコン部分
    ======================================== */

    .menu-icon {
      width: 125px;
      min-width: 125px;
      min-height: 106px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* カレンダー */

    .calendar-icon {
      background: #fff2f7;
    }


    .calendar-icon::before {
      content: "";
      position: absolute;
      width: 82px;
      height: 62px;
      border: 7px solid #d82c78;
      border-radius: 9px;
    }


    .calendar-icon::after {
      content: "";
      position: absolute;
      width: 82px;
      height: 14px;
      top: 38px;
      border-top: 7px solid #d82c78;
    }


    .calendar-icon span {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #d82c78;
      z-index: 2;
    }


    .calendar-icon span:nth-child(1) {
      left: 35px;
      top: 52px;
    }


    .calendar-icon span:nth-child(2) {
      left: 56px;
      top: 52px;
    }


    .calendar-icon span:nth-child(3) {
      left: 77px;
      top: 52px;
    }


    .calendar-icon span:nth-child(4) {
      left: 35px;
      top: 71px;
    }


    /* ========================================
       王冠
    ======================================== */

    .crown-icon {
      background: #fff2f7;
      color: #8127c7;
      font-size: 58px;
      font-weight: 900;
      line-height: 1;
    }


    /* ========================================
       グラフ
    ======================================== */

    .chart-icon {
      background: #fff2f7;
    }


    .chart-icon::before {
      content: "";
      position: absolute;
      width: 82px;
      height: 64px;
      border: 7px solid #d82c78;
      border-radius: 8px;
    }


    .bar {
      position: absolute;
      bottom: 25px;
      width: 9px;
      background: #d82c78;
      z-index: 2;
    }


    .bar1 {
      height: 18px;
      left: 35px;
    }


    .bar2 {
      height: 35px;
      left: 51px;
    }


    .bar3 {
      height: 51px;
      left: 67px;
    }


    .chart-arrow {
      position: absolute;
      left: 63px;
      top: 20px;
      z-index: 3;
      color: #d82c78;
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
    }


    /* ========================================
       テキスト
    ======================================== */

    .menu-text {
      flex: 1;
      min-width: 0;
      padding: 22px 4px 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }


    .menu-title {
      color: #111111;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.4;
      white-space: nowrap;
    }


    .menu-description {
      margin-top: 7px;
      color: #777777;
      font-size: 13px;
      line-height: 1.45;
      white-space: nowrap;
    }


    /* ========================================
       右矢印
    ======================================== */

   .arrow {
  width: 48px;
  min-width: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #d82c78;
  font-size: 50px;
  font-weight: 300;
  line-height: 1;
  transform: translateY(-15px);
}


   
    /* ========================================
       キャッチコピー
    ======================================== */

    .catch-copy {
      position: absolute;
      left: 25px;
      top: 72px;
      z-index: 5;
      color: #d82c78;
      font-size: 23px;
      font-weight: 800;
      line-height: 1.55;
    }


    .catch-line {
      width: 70px;
      height: 4px;
      margin-top: 14px;
      background: #d82c78;
      border-radius: 2px;
    }


    /* ========================================
       自転車
    ======================================== */

    .bike {
      position: absolute;
      width: 330px;
      height: 220px;
      right: -45px;
      bottom: 0;
      z-index: 4;
      opacity: 0.16;
    }


    .bike-wheel {
      position: absolute;
      width: 105px;
      height: 105px;
      bottom: 14px;
      border: 6px solid #d82c78;
      border-radius: 50%;
    }


    .wheel-left {
      left: 25px;
    }


    .wheel-right {
      right: 15px;
    }


    .bike-frame {
      position: absolute;
      width: 125px;
      height: 6px;
      left: 80px;
      bottom: 65px;
      background: #d82c78;
      transform: rotate(-24deg);
      transform-origin: left center;
      border-radius: 4px;
    }


    .frame2 {
      width: 120px;
      left: 125px;
      bottom: 65px;
      transform: rotate(26deg);
    }


    .frame3 {
      width: 100px;
      left: 83px;
      bottom: 65px;
      transform: rotate(0deg);
    }


    .bike-rider {
      position: absolute;
      width: 90px;
      height: 9px;
      left: 137px;
      bottom: 122px;
      background: #d82c78;
      transform: rotate(-15deg);
      border-radius: 10px;
    }


    /* ========================================
       LINEに戻る
    ======================================== */

    .line-back-button {
      display: block;
      width: calc(100% - 36px);
      min-height: 70px;
      margin: 26px 18px 28px;
      border: 3px solid #d82c78;
      border-radius: 22px;
      background: #ffffff;
      color: #d82c78;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;
      appearance: none;
    }


    .line-back-button:active {
      transform: scale(0.99);
    }


    /* ========================================
       小さいスマホ
    ======================================== */

    @media (max-width: 380px) {

      .header {
        padding: 24px 14px 20px;
      }


      .main-title {
        font-size: 28px;
      }


      .sub-title {
        font-size: 17px;
      }


      .menu {
        padding-left: 14px;
        padding-right: 14px;
      }


      .menu-item {
        min-height: 100px;
        margin-bottom: 16px;
      }


      .menu-icon {
        width: 108px;
        min-width: 108px;
        min-height: 100px;
      }


      .calendar-icon::before {
        width: 76px;
        height: 58px;
      }


      .calendar-icon::after {
        width: 76px;
      }


      .calendar-icon span:nth-child(1) {
        left: 29px;
      }


      .calendar-icon span:nth-child(2) {
        left: 48px;
      }


      .calendar-icon span:nth-child(3) {
        left: 67px;
      }


      .calendar-icon span:nth-child(4) {
        left: 29px;
      }


      .menu-text {
        padding-left: 8px;
      }


      .menu-title {
        font-size: 19px;
      }


      .menu-description {
        font-size: 11px;
      }


      .arrow {
        width: 42px;
        min-width: 42px;
      }


      .catch-copy {
        left: 20px;
        top: 65px;
        font-size: 20px;
      }


      .bike {
        right: -95px;
        transform: scale(0.9);
        transform-origin: bottom right;
      }


      .line-back-button {
        width: calc(100% - 28px);
        margin-left: 14px;
        margin-right: 14px;
        font-size: 19px;
      }

    }

/* ========================================
   下部ビジュアル画像
======================================== */

.visual-area {
  width: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #ffffff;
  line-height: 0;
}

.visual-image {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  padding: 0;
}

window.schedulePrefetchData = null;

function prefetchSchedule() {

  // すでに取得済みなら何もしない
  if (window.schedulePrefetchData) {
    return;
  }

  // 取得中なら重複取得しない
  if (window.schedulePrefetchLoading) {
    return;
  }

  window.schedulePrefetchLoading = true;


  function useAppData() {

    try {

      window.schedulePrefetchData =
        window.scheduleData || [];


      console.log(
        "★ スケジュール先読み完了"
      );

      console.log(
        "★ スケジュール:",
        window.schedulePrefetchData
      );


    } catch (error) {

      console.error(
        "schedule prefetch error:",
        error
      );

    } finally {

      window.schedulePrefetchLoading = false;

    }

  }


  // すでに共通データを取得済みなら
  // そのまま利用
  if (window.appDataReady === true) {

    useAppData();

    return;

  }


  // 共通データ取得完了を待つ
  const handleAppDataReady =
    function() {

      useAppData();

    };


  window.addEventListener(
    "appDataReady",
    handleAppDataReady,
    {
      once: true
    }
  );


  // 共通データ取得開始
  loadAppData();

}
    
    window.dailyPredictionsData = [];

window.addEventListener("message", function(event) {

  if (
    !event.data ||
    event.data.type !== "GAS_APP_DATA"
  ) {
    return;
  }

  if (

function loadAppData() {

  const appDataFrame =
    document.createElement("iframe");

  appDataFrame.src =
    "https://script.google.com/macros/s/AKfycbzZgmnWgmHdmk6e_agPRdZOGfTZ4uRzyrAnvehbNzAl9lF_iqYSjXFbYy3P7FrGOKk/exec";

}

    
function openSchedule() {

  document.getElementById("topPage").style.display = "none";
  document.getElementById("schedulePage").classList.add("active");

  window.scrollTo(0, 0);

  if (window.schedulePrefetchData) {

    renderSchedule(
      window.schedulePrefetchData
    );

    return;
  }

  // 先読み中なら、別リクエストを送らずに完了を待つ
  if (window.schedulePrefetchLoading) {

    const waitTimer = setInterval(function() {

      if (window.schedulePrefetchData) {

        clearInterval(waitTimer);

        renderSchedule(
          window.schedulePrefetchData
        );

      }

    }, 100);

    return;
  }

  // 先読みが開始されていない場合だけ通常取得
  loadSchedule();

}


    function formatJapaneseDate(dateText, weekday) {

      const parts = String(dateText || "").split("-");

      if (parts.length !== 3) {
        return dateText + "（" + weekday + "）";
      }

      const month = Number(parts[1]);
      const day = Number(parts[2]);

      return month + "月" + day + "日（" + weekday + "）";

    }


    
function renderFeaturedRiders(scheduleId, targetList) {

      '現在、注目選手の情報はありません。' +

  list.innerHTML =

    function loadSchedule() {

      const list =
        document.getElementById("scheduleList");

      list.innerHTML =
        '<div class="schedule-message">読み込み中です…</div>';


      const callbackName =
        "scheduleCallback_" + Date.now();


      window[callbackName] =
        function(response) {

          try {

            if (
              !response ||
              response.success !== true
            ) {

              throw new Error(
                response && response.error
                  ? response.error
                  : "データ取得に失敗しました。"
              );

            }

            window.featuredRidersData =
              response.featuredRiders || [];

            /*
             * 日別予想
             *
             * GASから返ってきた日別予想を保存します。
             * API側の項目名が predictions / dailyPredictions
             * のどちらでも受け取れるようにしています。
             */
            window.dailyPredictionsData =
              response.dailyPredictions ||
              response.predictions ||
              [];

            renderSchedule(
              response.schedules || []
            );

          } catch (error) {

            console.error(error);

            list.innerHTML =
              '<div class="schedule-message">' +
              'スケジュールを取得できませんでした。' +
              '<br>時間をおいて再度お試しください。' +
              '</div>';

          } finally {

            cleanup();

          }

        };


      const script =
        document.createElement("script");


  script.src =
  GAS_API_URL +
  "?mode=schedule&callback=" +
  encodeURIComponent(callbackName);


      script.onerror =
        function() {

          list.innerHTML =
            '<div class="schedule-message">' +
            'スケジュールを取得できませんでした。' +
            '<br>時間をおいて再度お試しください。' +
            '</div>';

          cleanup();

        };


      document.body.appendChild(script);


      function cleanup() {

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }

    }

   prefetchSchedule();

function renderDailyPredictions(schedule, targetNote, targetList) {

  const note =
    targetNote || document.getElementById("predictionDateNote");

  const list =
    targetList || document.getElementById("predictionList");

  if (!note || !list) {
    return;
  }

  const today = getTodayInJapan();

  let targetDate = today;

  if (today < schedule.startDate) {
    targetDate = schedule.startDate;
  }

  if (today > schedule.endDate) {
    targetDate = schedule.endDate;
  }

  const targetDateObj = new Date(targetDate + "T00:00:00");

  const targetWeekday =
    getJapaneseWeekdayFromDate(targetDateObj);

  const dateLabel =
    formatFullJapaneseDate(targetDate, targetWeekday);

  note.textContent =
    "※ 表示は" + dateLabel + "の予想です。";

  const predictions =
    (window.dailyPredictionsData || [])
      .filter(function(item) {

        const itemScheduleId =
          String(
            item.scheduleId ??
            item.id ??
            ""
          ).trim().padStart(3, "0");

        const targetScheduleId =
          String(schedule.id)
            .trim().padStart(3, "0");

        const itemDate =
          normalizeDateString(
            item.predictionDate ??
            item.date ??
            item.yosobi ??
            ""
          );

        return (
          itemScheduleId === targetScheduleId &&
          itemDate === targetDate
        );

      })
      .sort(function(a, b) {
        return Number(a.raceNumber ?? a.raceNo ?? 0) -
               Number(b.raceNumber ?? b.raceNo ?? 0);
      });

  if (!predictions.length) {
    list.innerHTML =
      '<div class="prediction-empty">' +
      'この日の予想はまだ公開されていません。' +
      '</div>';
    return;
  }

  list.innerHTML =
    predictions.map(function(item) {

      const raceNumber =
        item.raceNumber ??
        item.raceNo ??
        item.race ??
        "";

      const raceName =
        item.raceName ?? "";

      const startTime =
        item.startTime ??
        item.time ??
        "";

      return (
        '<div class="prediction-card">' +

          '<div class="prediction-race">' +
            escapeHtml(raceNumber) + 'R' +
          '</div>' +

          '<div class="prediction-info">' +

            '<div class="prediction-name">' +
              escapeHtml(raceName) +
            '</div>' +

            '<div class="prediction-time">' +
              (startTime
                ? '発走 ' + escapeHtml(startTime)
                : '') +
            '</div>' +

          '</div>' +

          '<button ' +
            'class="prediction-button" ' +
            'type="button" ' +
            'data-schedule-id="' + escapeHtml(schedule.id) + '" ' +
            'data-prediction-date="' + escapeHtml(targetDate) + '" ' +
            'data-race-number="' + escapeHtml(raceNumber) + '"' +
            '>' +
            '予想を見る ›' +
          '</button>' +

        '</div>'
      );

    }).join("");
}

    function renderTodayPredictions(predictions) {

  if (!list) {
    return;
  }


  const today =
    getTodayInJapan();

   */
  if (dateElement) {

    const todayDateObj =
  new Date(today + "T00:00:00");

const dateText =
  formatJapaneseDate(
    today,
    getJapaneseWeekdayFromDate(todayDateObj)
  );

    dateElement.textContent =
      dateText;

  }


  /*

   */
  if (!predictions || !predictions.length) {

      '<div class="today-empty">' +
      '本日の予想はまだ公開されていません。' +
      '</div>';

    return;
  }


  /*

   */
  const sortedPredictions =
    predictions.slice().sort(
      function(a, b) {

        const raceA =
          Number(
            a.raceNumber ??
            a.raceNo ??
            a.race ??
            0
          );

        const raceB =
          Number(
            b.raceNumber ??
            b.raceNo ??
            b.race ??
            0
          );

        return raceA - raceB;

      }
    );


  list.innerHTML =
    sortedPredictions.map(
      function(item) {


        const scheduleId =
          String(
            item.scheduleId ??
            item.id ??
            ""
          )
          .trim()
          .padStart(3, "0");


        /*
         * 開催情報を取得
         */
        const schedule =
          (window.scheduleData || [])
            .find(
              function(scheduleItem) {

                return (
                  String(
                    scheduleItem.id ?? ""
                  )
                  .trim()
                  .padStart(3, "0")
                  ===
                  scheduleId
                );

              }
            );


        const venue =
          schedule
            ? (
                schedule.venueText ||
                schedule.venue ||
                ""
              )
            : "";


        const raceNumber =
          String(
            item.raceNumber ??
            item.raceNo ??
            item.race ??
            ""
          ).trim();


        const raceName =
          item.raceName ??
          item.name ??
          "";


        const startTime =
          item.startTime ??
          item.time ??
          "";


        const honmei =
          item.honmei ??
          item.main ??
          item.honmeiText ??
          "";


        const taikou =
          item.taikou ??
          item.second ??
          item.taikouText ??
          "";


        const ana =
          item.ana ??
          item.third ??
          item.anaText ??
          "";


        const url =
          item.startListUrl ??
          item.raceUrl ??
          item.entryUrl ??
          item.url ??
          "";


        return (

          '<div class="today-prediction-card">' +


            '<div class="today-race-header">' +

              '<div class="today-race-number">' +
                escapeHtml(raceNumber) +
                'R' +
              '</div>' +


              '<div class="today-race-info">' +

                '<div class="today-venue">' +
                  escapeHtml(venue) +
                '</div>' +

                '<div class="today-race-name">' +
                  escapeHtml(raceName) +

    function getTodayInJapan() {

      const now = new Date();

      const y =
        now.getFullYear();

      const m =
        String(now.getMonth() + 1)
          .padStart(2, "0");

      const d =
        String(now.getDate())
          .padStart(2, "0");

      return y + "-" + m + "-" + d;

    }


    function normalizeDateString(value) {

      if (!value) {
        return "";
      }

      const text =
        String(value).trim();

      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
        return text;
      }

      const match =
        text.match(
          /(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/
        );

      if (!match) {
        return "";
      }

      return (
        match[1] + "-" +
        String(match[2]).padStart(2, "0") + "-" +
        String(match[3]).padStart(2, "0")
      );

    }


    function getJapaneseWeekdayFromDate(date) {

      const weekdays = [
        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"
      ];

      return weekdays[date.getDay()];

    }


    function formatFullJapaneseDate(
      dateText,
      weekday
    ) {

      const parts =
        String(dateText || "").split("-");

      if (parts.length !== 3) {
        return dateText + "（" + weekday + "）";
      }

      return (
        Number(parts[1]) +
        "月" +
        Number(parts[2]) +
        "日（" +
        weekday +
        "）"
      );

    }


    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function escapeJs(value) {

      return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

    }

let resultsPrefetchPromise = null;
let resultsLoadedMonth = '';

function prefetchResults(targetMonth) {

  // 同じ月のデータが取得済みなら再利用
  if (
    resultsLoadedMonth === targetMonth &&
    window.resultsPrefetched === true
  ) {
    return Promise.resolve({
      success: true,
      results: window.resultsData || [],
      hitRaces: window.hitRacesData || []
    });
  }

  // 同じ月の取得が進行中なら、その処理を再利用
  if (
    resultsPrefetchPromise &&
    resultsPrefetchPromise.month === targetMonth
  ) {
    return resultsPrefetchPromise.promise;
  }

  const requestPromise = fetch(
    GAS_API_URL +
      '?mode=results&month=' +
      encodeURIComponent(targetMonth),
    {
      method: "GET",
      cache: "no-store"
    }
  )
    .then(function(response) {

      if (!response.ok) {
        throw new Error(
          "HTTP error: " + response.status
        );
      }

      return response.json();

    })
    .then(function(response) {

      if (
        !response ||
        response.success !== true
      ) {
        throw new Error(
          "予想実績データの取得に失敗しました。"
        );
      }

      // 月切り替え後に古いリクエストが遅れて返った場合は反映しない
      if (window.resultsCurrentMonth === targetMonth) {

        window.resultsData =
          response.results || [];

        window.hitRacesData =
          response.hitRaces || [];

        resultsLoadedMonth = targetMonth;
        window.resultsPrefetched = true;

      }

      console.log(
        "★ 予想実績データ取得完了:",
        targetMonth
      );

      return response;

    })
    .catch(function(error) {

      console.error(

      );

      throw error;

    })
    .finally(function() {

      if (
        resultsPrefetchPromise &&
        resultsPrefetchPromise.month === targetMonth
      ) {
        resultsPrefetchPromise = null;
      }

    });

  resultsPrefetchPromise = {
    month: targetMonth,
    promise: requestPromise
  };

  return requestPromise;

      Number(item.hitRaces) || 0;

    honmeiCount +=
      Number(item.honmei) || 0;

    taikouCount +=
      Number(item.taikou) || 0;

    anaCount +=
      Number(item.ana) || 0;

  });


  const predictionElement =
    document.getElementById(
      "resultsPredictionCount"
    );

  const hitElement =
    document.getElementById(
      "resultsHitCount"
    );

  const rateElement =
    document.getElementById(
      "resultsHitRate"
    );


  if (predictionElement) {

    predictionElement.textContent =
      predictionCount;

  }


  if (hitElement) {

    hitElement.textContent =
      hitCount;

  }


  if (rateElement) {

    const rate =
      predictionCount > 0
        ? (
            hitCount /
            predictionCount *
            100
          ).toFixed(1)
        : "0.0";

    rateElement.textContent =
      rate + "%";

  }


  /*
   * 開催別実績一覧
   */

  if (!monthResults.length) {

    eventList.innerHTML =
      '<div class="results-empty">' +
      'この月の実績はありません。' +
      '</div>';

  } else {

    eventList.innerHTML =
      monthResults.map(function(item) {

        return (

          '<div class="results-event-card">' +

            '<div class="results-event-name">' +
              escapeHtml(item.venue) +
            '</div>' +

            '<div class="results-event-period">' +
              escapeHtml(
                formatResultsPeriod(
                  item.startDate,
                  item.endDate
                )
              ) +
            '</div>' +

            '<div class="results-event-data">' +

              '<div class="results-event-data-item">' +
                '<span class="label">予想</span>' +
                '<span class="value">' +
                  Number(item.predictionRaces || 0) +
                  'R' +
                '</span>' +
              '</div>' +

              '<div class="results-event-data-item hit">' +
                '<span class="label">★ 本命</span>' +
                '<span class="value">' +
                  Number(item.honmei || 0) +
                '</span>' +
              '</div>' +

              '<div class="results-event-data-item hit">' +
                '<span class="label">○ 対抗</span>' +
                '<span class="value">' +
                  Number(item.taikou || 0) +
                '</span>' +
              '</div>' +

              '<div class="results-event-data-item hit">' +
                '<span class="label">▲ 穴狙い</span>' +
                '<span class="value">' +
                  Number(item.ana || 0) +
                '</span>' +
              '</div>' +

              '<div class="results-event-data-item hit">' +
                '<span class="label">的中</span>' +
                '<span class="value">' +
                  Number(item.hitRaces || 0) +
                '</span>' +
              '</div>' +

            '</div>' +

            '<div class="results-event-rate">' +
              '的中率 ' +
              escapeHtml(
                formatResultsRate(item.hitRate)
              ) +
            '</div>' +

          '</div>'

        );

      }).join("");

  }


  /*
   * 的中レース一覧
   */

  const monthHitRaces =
    hitRaces.filter(function(item) {

      return (
        item.date >= monthStart &&
        item.date < monthEnd
      );

    });


  if (!monthHitRaces.length) {

    hitRaceList.innerHTML =
      '<div class="results-empty">' +
      'この月の的中レースはありません。' +
      '</div>';

  } else {

    hitRaceList.innerHTML =
      monthHitRaces.map(function(item) {

        return (

          '<div class="results-hit-race-card">' +

            '<div class="results-hit-star">★</div>' +

            '<div class="results-hit-info">' +

              '<div class="results-hit-name">' +
                escapeHtml(item.venue) +
              '</div>' +

              '<div class="results-hit-date">' +
                escapeHtml(
                  formatResultsDate(item.date)
                ) +
                '　' +
                escapeHtml(item.race) +
                'R' +
              '</div>' +

            '</div>' +

            '<div>' +

              '<div class="results-hit-type">' +
                escapeHtml(item.prediction) +
              '</div>' +

              '<div class="results-hit-payout">' +
                escapeHtml(item.payout) +
              '</div>' +

            '</div>' +

          '</div>'

        );

      }).join("");

  }

}


function formatResultsDate(dateText) {

  const parts =
    String(dateText || "").split("-");

  if (parts.length !== 3) {
    return dateText;
  }

  return (
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


function formatResultsPeriod(
  startDate,
  endDate
) {

  return (
    formatResultsDate(startDate) +
    "～" +
    formatResultsDate(endDate)
  );

}


function formatResultsRate(value) {

  const number =
    Number(value);

  if (isNaN(number)) {
    return String(value || "0.0%");
  }

  return (
    number * 100
  ).toFixed(1) + "%";

}

  });

}    

// ========================================
// 予想実績：月切り替え
// ========================================


let resultsCurrentMonth = (function() {
  const now = new Date();
  return new Date(
    now.getFullYear(),
    now.getMonth() - 1,
    1
  );
})();

function updateResultsMonth() {

  const year = resultsCurrentMonth.getFullYear();

  const month = resultsCurrentMonth.getMonth() + 1;

  const targetMonth =
    year + "-" + String(month).padStart(2, "0");

  // 現在選択している月を更新
  window.resultsCurrentMonth = targetMonth;

  document.getElementById("resultsMonth").textContent =
    year + "年" + month + "月";

  // 古い月のデータを一時的に消す
  window.resultsData = [];
  window.hitRacesData = [];

  const eventList =
    document.getElementById("resultsEventList");

  const hitRaceList =
    document.getElementById("resultsHitRaceList");

  if (eventList) {
    eventList.innerHTML = "実績データを読み込んでいます…";
  }

  if (hitRaceList) {
    hitRaceList.innerHTML = "的中レースを読み込んでいます…";
  }

  // 選択した月のデータを取得
  prefetchResults(targetMonth)
    .then(function() {

      // 取得中に別の月へ移動していた場合は表示しない
      if (window.resultsCurrentMonth !== targetMonth) {
        return;
      }

      renderResults();

    })
    .catch(function(error) {

      console.error(
        "月別予想実績取得エラー:",
        error
      );

      if (window.resultsCurrentMonth !== targetMonth) {
        return;
      }

      if (eventList) {
        eventList.innerHTML =
          "実績データを取得できませんでした。";
      }

      if (hitRaceList) {
        hitRaceList.innerHTML =
          "的中レースを取得できませんでした。";
      }

    });
}

document
  .getElementById("resultsPrevMonth")
  .addEventListener("click", function() {

    resultsCurrentMonth.setMonth(
      resultsCurrentMonth.getMonth() - 1
    );

    updateResultsMonth();

  });

document
  .getElementById("resultsNextMonth")
  .addEventListener("click", function() {

    resultsCurrentMonth.setMonth(
      resultsCurrentMonth.getMonth() + 1
    );

    updateResultsMonth();

  });

    
  </script>
